name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Mathematical Engine Audit
        run: npx tsx test-audit.ts

      - name: Build Web Production Assets
        run: npm run build

      - name: Generate Multi-Platform Release Artifacts
        run: npx tsx scripts/build-releases.ts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CalcRush ${{ github.ref_name }} — Multi-Platform Release"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            releases/CalcRush-Android-v1.4.0.apk
            releases/CalcRush-Windows-x64-v1.4.0-Setup.exe
            releases/CalcRush-Windows-x64-v1.4.0-Portable.exe
            releases/CalcRush-Linux-x64-v1.4.0.AppImage
            releases/CalcRush-Linux-x64-v1.4.0.deb
            releases/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
